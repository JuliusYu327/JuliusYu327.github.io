remote_theme: "mmistakes/minimal-mistakes@4.28.1"
minimal_mistakes_skin: "air"
locale: "zh-TW"
title: "Julius Yu"
title_separator: "｜"
subtitle: "IT Infrastructure / Cybersecurity"
name: "Julius Yu"
description: "企業網路、資訊安全與基礎架構專案紀錄。"
url: "https://juliusyu327.github.io"
baseurl: ""
repository: "JuliusYu327/JuliusYu327.github.io"
search: true
search_full_content: true
breadcrumbs: true
enable_copy_code_button: true
author:
  name: "Julius Yu"
  bio: "企業網路、資訊安全、伺服器與儲存設備。"
  location: "Taiwan"
footer:
  links: []
collections:
  projects:
    output: true
    permalink: /projects/:path/
defaults:
  - scope:
      path: ""
      type: projects
    values:
      layout: single
      author_profile: false
      toc: true
      toc_sticky: true
      toc_label: "專案目錄"
      share: false
      read_time: false
      related: false
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: false
include:
  - _pages
plugins:
  - jekyll-include-cache
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - _templates
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
timezone: Asia/Taipei
