name: Deploy Blowfish site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "hugo-pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Scan source for committed secrets
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInIE \
            --exclude-dir=.git \
            --exclude-dir=public \
            --exclude-dir=resources \
            --exclude='*.min.js' \
            '(AKIA[0-9A-Z]{16}|gh[pousr]_[A-Za-z0-9_]{36,}|xox[baprs]-[A-Za-z0-9-]{20,}|AIza[0-9A-Za-z_-]{35}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----)' .; then
            echo "Potential secret detected. Remove it before publishing."
            exit 1
          fi

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.25.x"

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.162.0"
          extended: true

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build
        run: hugo --gc --minify --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Verify generated security policy
        shell: bash
        run: |
          set -euo pipefail
          test -f public/index.html
          grep -Fq 'Content-Security-Policy' public/index.html
          grep -Fq 'strict-origin-when-cross-origin' public/index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Wait for source deployment
        run: sleep 45

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
