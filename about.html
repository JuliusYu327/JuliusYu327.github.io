<!DOCTYPE html>

<html lang="zh-Hant">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>凱茂資訊股份有限公司</title>
    <!-- 或使用 PNG -->
    <link rel="icon" href="image/favicon/k.png" type="image/png">
    <!-- CSS -->
    <link rel="stylesheet" href="about/about.css">

    <!-- Vuetify & Vue -->
    <link href="https://cdn.jsdelivr.net/npm/vuetify@3.6.0/dist/vuetify.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/@mdi/font/css/materialdesignicons.min.css" rel="stylesheet">
    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vuetify@3.6.0/dist/vuetify.min.js"></script>
    <!-- AOS -->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">

</head>

<body>
    <div id="app">
    <v-app>
      <canvas id="bg-canvas"></canvas>
      <v-main>
        
            <!-- Header -->
            <header id="header" class="header custom-header">
            <!-- 左側 Logo -->
            <div class="logo">
                <img :src="header.logoSrc" :alt="header.logoAlt" @click="scrollToTop" />
            </div>

            <!-- 漢堡按鈕 -->
            <div class="hamburger" @click="toggleMenu" :class="{ open: menuActive }">
                <span></span>
                <span></span>
                <span></span>
            </div>

            <!-- 導航選單 -->
            <nav :class="{ active: menuActive }">
                <ul class="nav-list">
                <li v-for="(item, index) in menuItems" :key="index">
                    <a :href="item.link" @click="menuActive = false">
                        {{ item.name }}
                    </a>
                </li>
                </ul>
            </nav>
            </header>





        
            <!-- about -->
            <section id="about" class="about" data-aos-delay="0">
                <div class="about-section">
                    <!-- 左邊卡片標題 -->
                    <div class="about-left" data-aos="fade-right" data-aos-delay="0">
                        <div class="about-card">
                            <h2>{{ about.title }}</h2>
                            <h3>{{ about.subtitle }}</h3>
                        </div>
                    </div>
                    <!-- 右邊卡片文字 -->
                    <div class="about-right" data-aos="fade-left">
                        <div class="about-card">
                            <p>{{ about.text }}</p>
                        </div>
                    </div>
                </div>
            </section>

                        <!-- Partners -->
            <section class="logos"  data-aos-delay="200">
            <h2>{{ logos.title }}</h2>
            <p class="logos-subtitle">{{ logos.subtitle }}</p>

            <div class="logo-marquee">
                <div class="logo-track">
                <!-- original partners -->
                <div v-for="(partner, index) in partners" :key="index" class="logo-box">
                    <img :src="partner.src" :alt="partner.alt" />
                </div>
                <!-- repeat partners，形成無縫循環 -->
                <div v-for="(partner, index) in partners" :key="'dup-'+index" class="logo-box">
                    <img :src="partner.src" :alt="partner.alt" />
                </div>
                </div>
            </div>
            </section>
            
            <!-- Google map -->
            <section id="map" class="map-section">
                    <div class="map-wrapper">
                        <iframe
                            src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d2164.9239223532513!2d120.65680582842539!3d24.138270008070506!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x34693d9f70c4f7c7%3A0x92f03742845b2fda!2z5Yex6IyC6LOH6KiK6IKh5Lu95pyJ6ZmQ5YWs5Y-4!5e0!3m2!1szh-TW!2stw!4v1757924210475!5m2!1szh-TW!2stw" 
                            width="600" 
                            height="450" 
                            style="border:0;" 
                            allowfullscreen="" 
                            loading="lazy" 
                            referrerpolicy="no-referrer-when-downgrade">
                        </iframe>
                    </div>
            </section>

            
 
            <!-- Contact -->
<section
  id="contact"
  class="contact"
  :style="{ backgroundImage: 'url(' + contact.background + ')' }"
>
  <div class="contact-wrapper">
    
    <!-- 左邊圖片 -->
    <div class="contact-left">
      <img :src="contact.titleSrc" :alt="contact.titleAlt" class="icon-title" />
    </div>

    <!-- 右邊聯絡資訊 -->
    <div class="contact-right">
      
      <!-- Email -->
      <div class="contact-item">
        <img :src="contact.mailSrc" :alt="contact.mailAlt" class="icon-mail" />
        <div>
          <h1>{{ contact.emailtitle }}</h1>
          <p>
            <a :href="'mailto:' + contact.email" class="contact-link">
              {{ contact.email }}
            </a>
          </p>
        </div>
      </div>

      <!-- 電話 -->
      <div class="contact-item">
        <img :src="contact.telSrc" :alt="contact.telAlt" class="icon-tel" />
        <div>
          <h1>{{ contact.teltitle }}</h1>
          <p>
            <a :href="contact.tel" class="contact-link">
              {{ contact.tel }}
            </a>
            <span v-if="contact.fex">，
              <a :href="contact.fex" class="contact-link">
                {{ contact.fex }}
              </a>
            </span>
          </p>
        </div>
      </div>

      <!-- 地址 -->
      <div class="contact-item">
        <img
          :src="contact.locationSrc"
          :alt="contact.locationAlt"
          class="icon-location"
        />
        <div>
          <h1>{{ contact.locationtitle }}</h1>
          <p>
            <a
              :href="'https://www.google.com/maps?q=' + encodeURIComponent(contact.location)"
              target="_blank"
              rel="noopener"
              class="contact-link"
            >
              {{ contact.location }}
            </a>
          </p>
        </div>
      </div>
    </div>
  </div>
</section>





            <!-- Footer -->
            <footer>
                <p>{{ footer.text }}</p>
            </footer>

      </v-main>
    </v-app>
  </div>

  <!-- Vue App -->
  <script src="about/about.js"></script>
  <!-- particle -->
  <script src="animetion/particle.js"></script>

  <!-- AOS -->
  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
  <script>
    AOS.init({ 
      duration: 20, 
      once: false,easing: 
      'ease-in-out-back',
      offset: window.innerHeight / 9 }
    );
  </script>
</body>
</html>
