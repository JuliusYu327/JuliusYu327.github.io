{{- $destination := .Destination -}}
{{- $external := or
  (strings.HasPrefix $destination "http://")
  (strings.HasPrefix $destination "https://")
  (strings.HasPrefix $destination "//")
-}}
<a href="{{ $destination | safeURL }}"
  {{- with .Title }} title="{{ . }}"{{ end -}}
  {{- if $external }} target="_blank" rel="noopener noreferrer external" referrerpolicy="strict-origin-when-cross-origin"{{ end -}}>
  {{- .Text | safeHTML -}}
</a>
